spring.application.name=studysync

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# LLM Configuration for AI Summaries, MCQs, and Q&A
studysync.llm.api-key=${LLM_API_KEY:}
studysync.llm.base-url=${LLM_BASE_URL:https://api.openai.com/v1}
studysync.llm.model=${LLM_MODEL:gpt-4o-mini}
studysync.llm.max-tokens=${LLM_MAX_TOKENS:1000}
studysync.llm.max-input-chars=${LLM_MAX_INPUT_CHARS:120000}

# Embedding & RAG Configuration
studysync.embedding.api-key=${EMBEDDING_API_KEY:${LLM_API_KEY:}}
studysync.embedding.base-url=${EMBEDDING_BASE_URL:${LLM_BASE_URL:https://api.openai.com/v1}}
studysync.embedding.model=${EMBEDDING_MODEL:}
studysync.rag.top-k=${RAG_TOP_K:3}

# JWT Authentication Configuration
studysync.jwt.secret=${JWT_SECRET:studysync-secure-jwt-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256}
studysync.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

